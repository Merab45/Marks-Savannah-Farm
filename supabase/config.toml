# Local Supabase settings only. This file contains no project reference or secrets.
project_id = "marks-savannah-farm-local"

[api]
enabled = true
port = 55421
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55422
shadow_port = 55420
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[db.migrations]
enabled = true

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://localhost:3000/**", "http://127.0.0.1:3000/**"]

[auth.email]
# Supabase CLI v3 renamed the email provider key; `enable_signup` is deprecated here.
enabled = true
double_confirm_changes = true
enable_confirmations = true
